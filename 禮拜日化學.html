const M=[
['01　物質分類・吸放熱・CO₂ 三相圖',[
'純物質：具固定組成與固定物性（熔點、沸點、密度、比熱），不可用物理方法分離。【元素】由【單一種原子】組成（H₂、O₂、O₃、Ag、Cu）；【化合物】由兩種以上原子依【一定比例】結合（H₂O、H₂O₂、HCl、CO、CO₂）。',
'混合物：成分比例【不固定】，保有原本【化學】性質，可用物理方法分離。均勻：米酒、雙氧水（【過氧化氫 H₂O₂】＋水）、鹽酸（【氯化氫 HCl】＋水）；非均勻：土壤、混濁果汁。',
'補充考點：2Ag + S → Ag₂S（化學變化）；鈍氣沸點隨分子量升高：He < Ne < Ar < Kr < Xe < Rn。',
'性質：【物理】性質不改變分子本質（顏色、熔沸點）；【化學】性質需經反應才顯現（可燃性、助燃性、酸鹼性）。三態：固態 (s) ⇄ 液態 (l) ⇄ 氣態 (g)；熔化、汽化、昇華吸熱；凝固、凝結、凝華放熱。',
'化學反應三特點：原子【種類】與【數目】不變；【分子】種類改變；伴隨【能量】變化。溫度升高，速率越【快】。',
'吸熱反應：反應物能量【低】、生成物【高】，容器感覺【冷】（光合作用、電解、熱分解、多數固體溶於水）。',
'放熱反應：反應物能量【高】、生成物【低】，容器感覺【熱】。溶於水放熱特例：【NaOH】、【濃硫酸稀釋】、【所有氣體】溶於水。',
'CO₂ 三相圖：I【固體】、II【液體】、III【氣體】；三相點 A【−57°C】、【5.2 atm】；臨界點 C【31°C】、【73 atm】；昇華點 Z【−78°C】、【1.0 atm】。D 在固氣平衡線（D–Z–A）上，B 在固液平衡線（A–B）上，A–C 為液氣平衡線；CO₂ 三相圖與 H₂O 相似，講義只討論相異處。',
'乾冰昇華：三相點壓力高於 1 atm，常壓下直接【昇華】（要見液態 CO₂ 須大於 5.2 atm）。AB 線斜率：多數物質與 CO₂ 為【正值】；唯獨水為【負值】（加壓冰的熔點下降）。']],
['02　原子結構演變・原子序・同位素',[
'1803 道耳頓：提出原子說，原子是不可再分的實心小球。',
'1897 湯姆森：以【陰極射線】實驗發現【電子】（帶負電，在電場中偏向【正極】），並求出荷質比 (e/m)。',
'氣體放電管：1 atm 時產生【電弧】；約 10⁻³ atm 時發光（日光燈、霓虹燈）；【高真空】時出現陰極射線（傳統映像管電視 CRT）。',
'1909 密立坎：【油滴實驗】——以 X 射線使油滴帶電，測得電子電量 1.6×10⁻¹⁹ C，推算電子質量 9.11×10⁻³¹ kg。',
'1911 拉塞福：以【α 粒子】（He²⁺）撞擊金箔，發現帶正電的【原子核】；1919 以 α 粒子撞擊氮核，發現【質子】。',
'1932 查兌克：以 α 粒子撞擊【鈹 (Be)】核，發現不帶電的【中子】。',
'三種射線：α（氦核 +2）、β（高速電子 −1）、γ（高能電磁波，不帶電）。',
'粒子：質量 中子（1.00866 amu）＞ 質子（1.00728 amu）≫ 電子（0.00055 amu）；質子 +1、電子 −1、中子不帶電；質子與中子在原子核，電子在核外。電子決定【化學反應】；質子決定【元素種類】；中子決定【同位素】。原子體積約為原子核的【10¹⁵】倍（半徑約 10⁵ 倍），原子內大部分是空的。',
'ᴬ_Z X 標示（原子序概念由【莫斯利】提出）：A =【質量數】＝質子＋中子；Z =【質子數】＝電子數（電中性）；A − Z ＝中子數。²³₁₁Na：質子 11、電子 11、中子【12】。',
'同位素：【質子數】相同、【中子數】不同（¹H 氕、²H 氘、³H 氚，其中氕無中子；¹²C 與 ¹⁴C），化性相同、物性不同。',
'同量素：質量數相同、原子序不同（¹⁴C 與 ¹⁴N），【物理性質相似，化學性質不同】。',
'同素異形體：同元素、結構不同的單質。碳：【鑽石、石墨、C₆₀】；氧：【O₂、O₃】。']],
['03　波耳電子排列・八隅體・週期表',[
'波耳模型：提出【能階】概念，K(n=1)、L、M、N；n 越小能量越【低】，電子由 n 最【小】填起。每層最多【2n²】：K【2】、L【8】、M【18】、N【32】。',
'電子組態表示法：₃Li (2,1)、₁₁Na (2,8,1)、₉F (2,7)、₁₇Cl (2,8,7)。',
'核心規律：價電子數＝【A 族族數】；有電子的層數＝【週期數】。',
'高頻陷阱：最外層最多 8 個（K 層為最外層時最多 2 個）。₂₀Ca 為【(2, 8, 8, 2)】（第四週期、2A），不可寫 (2, 8, 10)；₁₉K 為【(2, 8, 8, 1)】。',
'八隅體：鈍氣最外層【8】個最穩定，唯獨 He 為【2】。其他元素傾向得失或共用電子達穩定。',
'週期表：門得列夫依【原子量】；莫斯利依【原子序】。共 7 週期、【18】族，同族價電子數相同、化性相似。',
'週期與族：週期表每一【橫列】稱為週期，同週期電子層數相同；每一【直行】稱為族。IUPAC（國際純粹與應用化學聯合會）將週期表分為【18】族；傳統分法依序為 1A、2A、3B、4B、5B、6B、7B、8B（三欄）、1B、2B、3A–8A，A 族為主族元素、B 族為過渡元素。',
'族名：1A【鹼金族】（H 不是）；2A【鹼土金族】；7A【鹵素】；8A【鈍氣】（He 為 2）。',
'金屬與非金屬：左下【金屬】易失電子，氧化物溶水呈【鹼】性；右上【非金屬】易得電子，氧化物呈【酸】性。',
'原子半徑：同族由上而下漸【大】；同週期由左而右漸【小】。']],
['04　水的性質・自來水淨化五步驟',[
'水含量：人體含水約【70%】，地球表面約【70%】被海洋覆蓋，真正可利用的淡水約占地球總水量【1%】。',
'物性：1 atm 沸點【100°C】、凝固點【0°C】；加壓沸點【上升】。【4°C】密度最大【1 g/cm³】；【汽化熱】與【比熱】大，調節【氣溫】；0→4°C 熱縮冷脹，4°C 時體積最小。',
'化性：水＋活性金屬→氫氧化物＋【氫氣】；＋金屬氧化物→【鹼】性；＋非金屬氧化物→【酸】性。',
'自然水：存在於自然界、未經處理的水（湖水、河水、地下水）。淨化過程為沉降、凝聚、過濾（除臭）、曝氣、消毒。',
'沉降與凝聚：引入水池【靜置】澄清，大顆粒泥沙沉降、小微粒仍懸浮；加凝聚劑【明礬 KAl(SO₄)₂·12H₂O】形成【膠狀】Al(OH)₃ 包裹懸浮微粒。',
'過濾與曝氣：沉澱後的水通過砂層，濾材多為直徑約【0.4～0.54 mm】的細砂；【活性碳】（或木炭）吸附色素與臭味。曝氣：讓水濺起水花，增加與【空氣】接觸面積、提高【溶氧量】，加速【微生物】把有機污染物氧化分解成【二氧化碳】與【水】。',
'消毒：常用【氯氣】（濃度約 0.2～1.0 ppm，價錢便宜，但會殘留不良氣味，甚至產生致癌物質）與【臭氧】（濃度約 1.0 ppm，殺菌力比氯氣【強】，易自行分解、時效短，無法防止再次污染）。',
'補充考點：糖水為【真溶液】，牛奶、豆漿為【膠體溶液】。NaClO + 2HCl → NaCl + H₂O + 【Cl₂↑（劇毒氯氣）】。']],
['05　水的軟化與純化（重點強化）',[
'硬水：含較多 Ca²⁺、【Mg²⁺】的水，分暫時硬水與永久硬水。缺點：(1) 與肥皂產生鈣皂／鎂皂沉澱（皂垢），降低洗滌效果；(2) 工業鍋爐加熱產生【鍋垢】（CaCO₃、Mg(OH)₂、CaSO₄），導熱不良甚至引發爆炸。',
'暫時硬水：陰離子為【HCO₃⁻】，煮沸產生【CaCO₃】或【MgCO₃ / Mg(OH)₂】沉澱而軟化。',
'永久硬水：陰離子為【SO₄²⁻】、【Cl⁻】，不能用煮沸法。煮沸法只適用【暫時】硬水。',
'石灰蘇打法：加【Ca(OH)₂】與【Na₂CO₃】。陽離子交換：鈉型樹脂 R–Na 把 Ca²⁺、Mg²⁺ 換成 Na⁺，失效後用【濃食鹽水】再生。',
'俗名：生石灰【CaO】｜熟石灰【Ca(OH)₂】｜石灰石【CaCO₃】｜蘇打【Na₂CO₃】｜小蘇打【NaHCO₃】｜燒鹼【NaOH】。',
